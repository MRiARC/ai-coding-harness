[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "0.1.0"
description = "LCC x DevClub AI Coding Harness - hierarchical coding-agent harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "textual>=0.60",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest-asyncio>=0.24",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tool schema dicts are intentionally shared class-level constants.
"src/harness/tools/*" = ["RUF012"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["harness"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["psycopg"]
ignore_missing_imports = true

# Tools declare their JSON-schema parameters as named arguments; the ABC's
# **kwargs is the dispatch contract, so the override narrowing is intentional.
[[tool.mypy.overrides]]
module = "harness.tools.*"
disable_error_code = ["override"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=harness --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
]
